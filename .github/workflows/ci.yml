name: hooks

# The hooks are the only executable part of this plugin, and a broken one can strand a workflow or
# silently stop enforcing a rule. Until now the suites ran when the author remembered them.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: hook suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The suites need a git identity: several fixtures commit inside a throwaway repository.
      - name: Configure git for the fixtures
        run: |
          git config --global user.email ci@groundwork.test
          git config --global user.name groundwork-ci
          git config --global init.defaultBranch main

      - name: Report the tools the suites depend on
        run: |
          for t in bash jq python3 git; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo 'MISSING')"
          done

      - name: Run every hook suite
        run: bash hooks/tests/all.sh

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deterministic and always runs: the manifests must at least be valid JSON, and the plugin's
      # description must be identical in both files — it is the catalog's whole search surface.
      - name: Parse the manifests and compare the descriptions
        run: |
          python3 - <<'PY'
          import json, sys
          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))
          entry = next(p for p in market['plugins'] if p['name'] == 'groundwork')
          print('version:', plugin['version'])
          if plugin['description'] != entry['description']:
              sys.exit('plugin.json and marketplace.json describe the plugin differently')
          print('descriptions match')
          PY

      # `claude plugin validate` is the same check the catalog's review pipeline runs, so use it when
      # the CLI is on the runner — and say so out loud when it is not, instead of passing in silence.
      # No --strict: it turns an unknown-field warning into a failure.
      - name: Validate the plugin with the Claude CLI, when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "NOTE: the claude CLI is not on this runner — plugin validation did NOT run here."
            echo "The JSON parse above is all that was verified. Run 'claude plugin validate .' locally."
          fi
